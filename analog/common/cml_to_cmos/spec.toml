[interface]
purpose = "continuous differential VCO clock to complementary CMOS clocks"
ports = ["inp", "inn", "outp", "outn", "vbias", "vdd", "vss"]
static_data_conversion = false
input_nominal_frequency_hz = 2e9
input_nominal_common_mode_v = 1.632
input_nominal_differential_swing_pp_v = 0.4
supply_nominal_v = 1.8
output_load_per_pin_f = 20e-15
bias_reference_current_a = 0.85e-3

[architecture]
input_buffer = "LVT NMOS source followers with body at vss"
level_conversion = "two mirrored NMOS differential/PMOS mirror paths"
clock_restoration = "rising-edge pulse detectors, SR latch, matched rising delay and CMOS drivers"
reset_port = false
closed_loop_duty_cycle_correction = false
startup_policy = "output invalid until input clock establishes alternating valid edges"

[validation]
process_corners_at_27c = ["tt", "ss", "ff", "sf", "fs"]
temperature_cases_c = [27, 125]
temperature_scope = "125C tested at TT only"
supply_cases_v = [1.8]
frequency_cases_hz = [1e9, 2e9]
frequency_scope = "1GHz at TT only; 2GHz at listed process/temperature points"
minimum_input_swing_characterized = false
continuous_common_mode_range_characterized = false
full_pvt_characterized = false
mismatch_characterized = false
phase_noise_characterized = false
post_layout_characterized = false

[usage]
default_vco_connection = "one receiver per VCO differential pair, without an extra CML buffer"
extra_cml_buffer = "optional for multiple CML loads, long routes or an established isolation requirement"
heavier_cmos_load = "add or resize CMOS clock drivers after conversion"
