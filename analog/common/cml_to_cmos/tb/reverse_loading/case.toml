id = "reverse_loading"
dut = "analog/common/cml_to_cmos"
level = "block"
status = "prototype"
purpose = "在每端 400 Ω 有限源阻抗下比较 20/80 fF CMOS 负载变化对输入电压的影响；不作为噪声隔离度。"
analyses = ["tran", "load_comparison"]
measurements = ["input_voltage_change", "input_admittance", "clock_duty", "output_edges", "power"]
shared_stimuli = ["verification/stimuli/spice/cml_diff_sine.spice"]

[implementation]
view = "schematic"
simulator = "ngspice"
testbench = "analog/common/cml_to_cmos/tb/functional/tb_cml_to_cmos_ngspice.cir.in"

[sweep]
parameters = ["rsource", "cload"]

[requirements]
status = "exploratory"
