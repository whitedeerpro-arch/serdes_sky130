id = "precharge"
dut = "analog/pll/loop_filter"
level = "block"
status = "prototype"
purpose = "从两个电容初值为零开始，通过真实传输门预充；两节点均稳定在目标±1mV才认为预充建立。"
analyses = ["tran"]
measurements = ["precharge_time", "control_voltage", "integrator_voltage", "precharge_current"]
[implementation]
view = "transistor_switch_ideal_passive_RC"
simulator = "ngspice47"
testbench = "analog/pll/loop_filter/tb/precharge/tb_lf_precharge_ngspice.cir.in"
[requirements]
status = "engineering_screen"
maximum_error_both_nodes_v = 0.001
minimum_hold_s = 1e-7
physical_cold_start_yield_verified = false
