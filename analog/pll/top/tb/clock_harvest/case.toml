id = "clock_harvest"
dut = "analog/pll/top"
level = "system"
status = "prototype_clock_source_record"
purpose = "新运行原生闭环PLL，连续保存所有VCO、buffer、slave/master分频抽头，为发射窗口提取时钟。"
analyses = ["tran", "continuous_stable_window"]
measurements = ["frequency_error_ppm", "phase_span_ui", "source_window", "multiphase_outputs"]
[implementation]
bench = "analog/pll/top/tb/acquisition/tb_pll_clock_harvest_checkpoints_ngspice.cir.in"
solver = "Sparse"
num_threads_requested = 4
reltol = 0.0001
maximum_step_s = 2e-11
native_varactors = true
powered_balanced_extraction_branches = 4
near_lock_precharged_initialization = true
reference_phase_initialized_from_preflight = true
[requirements]
frequency_tolerance_fraction = 0.0001
rolling_phase_span_limit_ui = 0.08
rolling_window_ui = 512
hold_ui = 1280
[limitations]
startup_acquisition_benchmark = false
random_noise_PVT_signoff = false
