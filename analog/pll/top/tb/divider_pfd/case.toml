[implementation]
view = "schematic"
simulator = "ngspice47"
testbench = "tb_divider_pfd_ngspice.cir.in"

[sweep]
parameters = ["VCO_input=2GHz (ideal source)", "N=4,8,16"]

[requirements]
status = "unspecified"
