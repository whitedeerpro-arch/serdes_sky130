id = "precharged_capture"
dut = "analog/pll/top"
level = "system"
status = "prototype"
purpose = "先独立确认LF两个状态的冷预充时间，再从预充状态测释放后的捕获；区分原生电路和校准混合视图。"
analyses = ["tran", "frequency_step"]
measurements = ["precharge_state", "capture_ui", "confirmed_lock_ui", "frequency_error", "unwrapped_phase_span_ui"]
[implementation]
native_bench = "analog/pll/top/tb/acquisition/tb_pll_precharged_checkpoint_ngspice.cir.in"
mixed_bench = "analog/pll/top/tb/acquisition/tb_pll_calibrated_mixed_ngspice.cir.in"
lock_screen = "verification/contracts/pll_lock_screen.toml"
native_solver = "Sparse; no global cshunt"
native_reltol = 0.0001
nominal_display_ui_s = 2.5e-10
native_capacitor_initialization = "DC-precharged; both Vctrl and integrator checked before release"
native_release_ui = 80
[requirements]
status = "engineering_screen_only"
maximum_frequency_error_fraction = 0.0001
maximum_unwrapped_phase_span_ui = 0.08
required_hold_ui = 1280
cold_full_PLL_power_on_verified = false
