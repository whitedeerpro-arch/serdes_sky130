id = "physical_clock"
dut = "analog/tx/serializer"
level = "integration"
status = "prototype"
purpose = "原生PLL边沿选择/极性路由，理想化电压源之后接实际相位trim及fanout buffer，再驱动CML串化器。"
analyses = ["tran", "2UI_eye", "payload_decode", "loaded_phase"]
measurements = ["marker_errors", "payload_errors", "minimum_signed_margin_v", "extra_crossings", "transition_spread_ui", "loaded_clock_phase", "distribution_power"]
[implementation]
bench = "analog/tx/serializer/tb/functional/tb_serializer16_physical_clock_ngspice.cir.in"
clock_subcircuit = "serdes_cml_clock_distribution"
serializer_subcircuit = "serdes16_cml_tree_retimed"
clock_period_extension = false
individual_clock_source_time_shift = false
actual_buffer_load_included = true
[stimuli]
training_words_hex = ["0xaaaa", "0xaaaa", "0xd3a5", "0x6c9e"]
payload_words = 64
payload_bits = 1024
payload_type = "Independent held-out LFSR7 sequence, d0 first"
word_update_reference = "PLL /8 falling edges plus measured buffer propagation, synchronous boundary"
nominal_word_arrival_advance_ui = 0.0
fit_payload_phase = false
fit_output_UI = false
[requirements]
minimum_signed_margin_v = 0.075
maximum_transition_spread_ui = 0.15
maximum_extra_crossings = 0
maximum_missing_transitions = 0
maximum_loaded_phase_error_ui = 0.03
[limitations]
physical_parallel_capture_register_present = false
PLL_port_loading_backaction_across_ideal_boundary = false
automatic_phase_selection_or_reset_verified = false
