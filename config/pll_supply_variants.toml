# Architecture planning only. No active DUT, rail specification or working
# revision is changed. This comparison authorizes no new circuit simulation.
status = "planning_only_no_simulation"
preferred_next_architecture = "hv18_with_bypass18"
primary_vs_alternative = "1+2 versus 3; no adoption or electrical qualification"
preferred_lv15_exploration = "lv15_core; avoid assuming CP/dividers must also run at 1.5 V"

[variants.hv18]
description = "3.3 V analog input -> thick-oxide regulator -> quiet 1.8 V island"
vin_nominal_v = 3.3
vin_min_v = 3.0
vin_max_v = 3.6
vout_nominal_v = 1.8
vout_tolerance_fraction = 0.02
status = "proposed_interface_range; not a promise of 5.5 V compatibility"

[variants.bypass18]
description = "Qualified external 1.8 V -> isolated bypass -> same quiet island"
vin_nominal_v = 1.8
vin_min_v = 1.65
vin_max_v = 1.95
vout_nominal_v = 1.8
vout_tolerance_fraction = 0.0
status = "baseline DC range retained; ripple/PSD and reverse-blocking interface unqualified"

[variants.lv15]
description = "1.8 V input -> low-dropout regulator -> quiet 1.5 V island"
vin_nominal_v = 1.8
vin_min_v = 1.65
vin_max_v = 1.95
vout_nominal_v = 1.5
vout_tolerance_fraction = 0.02
status = "unmeasured low-voltage architecture; keep dividers/TX/RX on host 1.8 V initially"

[variants.lv15_core]
description = "1.8 V -> quiet 1.5 V VCO only; retain CP/LF and dividers at host 1.8 V"
vin_nominal_v = 1.8
vin_min_v = 1.65
vin_max_v = 1.95
vout_nominal_v = 1.5
vout_tolerance_fraction = 0.02
status = "preferred scope of LV exploration; mixed-supply LF reference, local bias, code drive and clock interface unresolved"

[planning]
load_currents_ma = [4.0, 6.0, 10.0]
quiescent_current_ma = 0.0 # Excluded for comparison, not an LDO design result.
example_input_tone_mvpp = 20.0
example_local_tone_target_mvpp = 2.0 # Planning example, not an adopted spec.
input_tones_mvpp = [10.0, 20.0, 50.0, 100.0]
cap_area_mm2_per_pf = 0.00087 # Existing project prelayout estimate.
transient_step_ma = [0.1, 1.0]
unserved_step_ns = 5.0
example_output_droop_mv = 10.0

[vco_projection]
observed_supply_v = [1.65, 1.8]
target_supply_v = 1.5
method = "same-code bracketed roots; linear supply extension is a hypothesis, never acceptance"
current_lower_threshold_v = 0.90
example_shifted_lower_threshold_v = 0.75
cp_headroom_proxy_v = 0.39 # Measured near 1.65-1.95 V; extrapolation at 1.5 V.
monitor_upper_drop_proxy_v = 0.44 # H4 illustration, no 1.5 V qualification.
