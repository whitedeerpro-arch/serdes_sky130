# 本机 EDA 与仿真工具路径配置。
[simulators.ngspice]
executable = "/opt/ngspice47/bin/ngspice"
version = "47"
init_file = "config/ngspice/spiceinit"

[simulators.ngspice.shared]
library = "/home/host/.local/opt/ngspice47-shared/lib/libngspice.so"
include = "/home/host/.local/opt/ngspice47-shared/include"
version = "47"
solver = "KLU"
one_analysis_per_process = true

[simulators.verilator]
executable = "/usr/bin/verilator"
version = "4.028"
flow = "SystemVerilog_to_CXX; direct_eval_ports; no_DPI_wrapper_required"

[simulators.xyce]
executable = "/home/host/.local/eda/bin/Xyce"
version = "7.10.0"
build = "serial"
sky130_verified = false

[timing.opensta]
executable = "/home/host/.local/opt/opensta-focal-20191111/usr/bin/sta"
version = "2.0.17"
status = "local_timing_checks_only; signoff_sta_runs_in_openroad_pnr_flow"

[layout]
magic = "/home/host/.local/bin/magic"
magic_batch = "/home/host/.local/opt/magic-8.3.685-capfix/bin/magic-capfix"
klayout = "/home/host/.local/bin/klayout"
netgen = "/home/host/.local/bin/netgen"

[python]
executable = ".venv/bin/python"
