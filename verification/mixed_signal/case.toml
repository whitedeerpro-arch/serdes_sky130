status = "short_nominal_live_RTL_transistor_flow_verified"
runner = "verification/mixed_signal/cpp/cosim.cpp"
build = "verification/mixed_signal/Makefile"
rtl_top = "verification/mixed_signal/rtl/mixed_cdr_top.sv"
analog_template = "verification/mixed_signal/tb/receiver.cir.in"
results = "docs/data/mixed_signal_cosim.json"
line_rate_bps = 4000000000
ui_s = 2.5e-10
pair_rate_hz = 2000000000
bundle_bits = 16
bundle_rate_hz_nominal = 250000000
production_kp_q = 8192
flow_smoke_kp_q = 65536
long_lock_or_BER_qualification = false
actual_CML_word_hold_bank_implemented = false
physical_16UI_demux_timing_closed = false
native_PLL_revalidation_required = false

[analog_to_digital]
source = "actual_static_CMOS_pair_retimer_pins"
clock_pin = "ck"
clock_threshold_v = 0.9
read_delay_s = 3.5e-10
low_v = 0.54
high_v = 1.26
unknown_data_policy = "count_and_fail_run; binary_placeholder_is_not_valid_data"
unknown_edge_policy = "count_and_invalidate_entire_control_bundle"
valid_is_hardware_metastability_detector = false
bundle_adapter = "behavioral_8_pair_accumulator; chronological_data_edges_plus_previous_data"
bundle_delay_s = 5e-11

[digital_to_analog]
source = "actual_registered_RTL_commutator_outputs"
levels_v = [0.0, 1.8]
launch_delay_s = 5e-11
input_slew_s = 2e-11
driver = "two_real_SKY130_CMOS_inverters_per_24_control_pins; wn4_wp8"
driver_delay = "solved_by_ngspice"
launch_delay_calibrated_by_STA = false

[solver]
method = "single_continuous_shared_ngspice_transient"
max_step_s = 2e-12
accepted_points_only_advance_RTL = true
external_sources_pure_time_functions = true
trial_source_history_s = 2e-9
one_analysis_per_process = true
retained_ngspice_points_expected = 1
ring_s = 2e-9
ring_max_points = 32768
window_max_points = 65536
max_windows = 16
progress_wall_interval_s = 5
digital_VCD_and_event_log_time_bounded = false

[cases.live]
stop_s = 4.8e-8
hold_analog_controls = false
minimum_payload_words = 2
allowed_payload_errors = 0
minimum_abs_analog_phase_shift_ps = 5
analog_control_pin_must_toggle = true

[cases.hold]
stop_s = 2.4e-8
hold_analog_controls = true
RTL_must_continue_updating = true
maximum_abs_analog_phase_shift_ps = 1
analog_control_pin_must_toggle = false
payload_words_required = 0
